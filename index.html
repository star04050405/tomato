<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tomato. 番茄田 · 专注一下</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#E64B35">
<style>
:root{
  --red:#E64B35; --red-deep:#C93A27; --leaf:#3F9B4F;
  --orange:#F26A2E; --ink:#2B2B2B; --paper:#FDFBF6;
  --line:#E7E2D6; --grey:#9A958A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  background:var(--paper);color:var(--ink);min-height:100vh;
}
/* 横线本底 */
.lines{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);
  opacity:.55;
}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 18px 90px}

/* 台历头 */
.banner{
  background:var(--orange);color:#fff;margin:0 -18px;padding:9px 20px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:13px;font-weight:600;letter-spacing:.04em;
}
.banner .ml{font-style:italic;opacity:.95}
#snd-btn{
  border:none;background:rgba(255,255,255,.22);color:#fff;font-size:14px;
  border-radius:999px;width:30px;height:26px;line-height:1;cursor:pointer;font-family:inherit;
}

/* 标题 */
header{padding:26px 2px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-size:44px;font-weight:900;letter-spacing:-.02em;line-height:1}
h1 em{font-style:normal;color:var(--red)}
.sub{color:var(--grey);font-size:14px;margin-top:9px;font-weight:500}
.harvest{text-align:right;flex-shrink:0}
.harvest .n{font-size:30px;font-weight:900;color:var(--red);line-height:1}
.harvest .n small{font-size:14px;font-weight:700;color:var(--ink)}
.harvest .t{font-size:12px;color:var(--grey);margin-top:4px;font-weight:500}

/* 舞台 */
.stage{
  margin-top:20px;border:2.5px solid var(--ink);border-radius:22px;
  background:#fff;padding:22px 18px 20px;position:relative;overflow:hidden;
  box-shadow:4px 5px 0 rgba(43,43,43,.12);
}
.stage.idle{border-style:dashed;box-shadow:none;background:rgba(255,255,255,.6)}
.st-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.st-tag{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--red)}
.st-act{display:flex;gap:8px;align-items:center}
.st-act button{
  border:2px solid var(--ink);background:#fff;border-radius:999px;
  font-size:13px;font-weight:700;padding:6px 14px;color:var(--ink);font-family:inherit;
}
.st-act button.ghost{border-color:transparent;color:var(--grey);font-weight:600;padding:6px 6px}
.st-act button:active{transform:scale(.96)}
.st-main{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 2px}
.st-tomato{width:172px;flex-shrink:0;filter:drop-shadow(2px 3px 0 rgba(230,75,53,.14))}
.st-tomato.pulsing{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
.st-info{text-align:center;min-width:0}
.st-name{font-size:17px;font-weight:800;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:78vw}
.st-time{font-size:54px;font-weight:900;letter-spacing:.01em;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1.05}
.st-time.over{color:var(--red)}
.st-hint{font-size:12px;color:var(--grey);margin-top:4px;font-weight:500}
.st-idle-msg{text-align:center;padding:26px 0 20px;color:var(--grey);font-size:14px;font-weight:600}
.st-idle-msg .big{font-size:15px;color:var(--ink);font-weight:800;margin-bottom:5px}

/* 表单 */
.seed{margin-top:18px;border:2px solid var(--ink);border-radius:18px;background:#fff;padding:14px 14px 13px;box-shadow:3px 4px 0 rgba(43,43,43,.1)}
.seed-row{display:flex;gap:9px}
.seed input{
  flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;
  font-size:16px;padding:11px 13px;font-family:inherit;font-weight:600;background:#FEFEFC;color:var(--ink);
}
.seed input:focus{outline:none;border-color:var(--red)}
.seed input::placeholder{color:#C9C4B8;font-weight:500}
.sizes{display:flex;gap:8px;margin-top:11px}
.size-chip{
  flex:1;border:2px solid var(--line);border-radius:12px;background:#fff;
  padding:9px 4px 8px;text-align:center;cursor:pointer;user-select:none;
  transition:border-color .15s,background .15s;
}
.size-chip svg{display:block;margin:0 auto 2px;width:26px}
.size-chip.csS svg{width:18px}
.size-chip.csM svg{width:26px}
.size-chip.csL svg{width:35px}
.size-chip .nm{font-size:13px;font-weight:800}
.size-chip .mn{font-size:11px;color:var(--grey);font-weight:600;margin-top:1px}
.size-chip.on{border-color:var(--red);background:#FEEEEA}
.size-chip.on .nm{color:var(--red)}
.seed-foot{display:flex;gap:9px;margin-top:12px;align-items:center}
.mins-box{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--grey)}
.mins-box input{
  width:64px;border:2px solid var(--line);border-radius:10px;font-size:16px;
  padding:8px 6px;text-align:center;font-family:inherit;font-weight:800;color:var(--ink);background:#FEFEFC;
}
.mins-box input:focus{outline:none;border-color:var(--red)}
.btn-plant{
  margin-left:auto;border:none;background:var(--red);color:#fff;font-family:inherit;
  font-size:15px;font-weight:800;border-radius:999px;padding:11px 24px;letter-spacing:.05em;
  box-shadow:0 3px 0 var(--red-deep);
}
.btn-plant:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-deep)}

/* 田 */
.field-head{display:flex;align-items:baseline;gap:10px;margin:30px 2px 12px}
.field-head h2{font-size:19px;font-weight:900}
.field-head .cnt{font-size:13px;color:var(--grey);font-weight:700}
.field-head .clear{margin-left:auto;font-size:12px;color:var(--grey);font-weight:700;border:none;background:none;text-decoration:underline;font-family:inherit}
.field{display:flex;flex-wrap:wrap;gap:14px 10px;justify-content:center}
.tcard{width:calc(33.33% - 7px);max-width:128px;text-align:center;cursor:pointer;position:relative}
.tcard:active{transform:scale(.97)}
.tcard svg{width:100%;display:block}
.tcard.big{width:100%;max-width:148px}
.tcard.small{width:calc(31% - 7px);max-width:96px}
.tname{font-size:13px;font-weight:800;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.tcard.small .tname{font-size:12px}
.tcard.done .tname{color:var(--red)}
.tmark{position:absolute;top:0;left:2px;font-size:11px;font-weight:800;color:#fff;background:var(--red);border-radius:999px;padding:2px 7px;display:none}
.tcard.running .tmark{display:block}
.tcard.running{animation:tup 2.2s ease-in-out infinite}
@keyframes tup{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.empty{
  width:100%;text-align:center;padding:34px 0 30px;color:var(--grey);
  border:2.5px dashed var(--line);border-radius:20px;margin-top:4px;background:rgba(255,255,255,.5);
}
.empty .e-t{font-size:14.5px;font-weight:800;color:var(--ink);margin-top:10px}
.empty .e-s{font-size:12.5px;margin-top:4px;font-weight:500}
.empty svg{width:64px;opacity:.5}

/* sheet */
.mask{position:fixed;inset:0;background:rgba(43,43,43,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .22s}
.mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:#fff;
  border-radius:24px 24px 0 0;padding:14px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.25,1);
  max-width:560px;margin:0 auto;
}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:40px;height:4.5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sh-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.sh-tom{width:64px;flex-shrink:0}
.sh-name{font-size:17px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-meta{font-size:12.5px;color:var(--grey);font-weight:600;margin-top:3px}
.sh-btns{display:flex;flex-direction:column;gap:9px}
.sh-btn{
  border:2px solid var(--ink);background:#fff;border-radius:14px;padding:13px;
  font-size:15px;font-weight:800;font-family:inherit;color:var(--ink);text-align:center;
}
.sh-btn:active{transform:scale(.98)}
.sh-btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.sh-btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}
.sh-btn.danger{border-color:#E5B9B2;color:#C0392B;font-weight:700}

/* 撒花 */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti span{position:absolute;font-size:22px;animation:fall 1.5s ease-in forwards}
@keyframes fall{
  0%{transform:translateY(-30px) rotate(0);opacity:1}
  100%{transform:translateY(78vh) rotate(260deg);opacity:0}
}

/* toast */
.toast{
  position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(16px);
  background:var(--ink);color:#fff;font-size:13.5px;font-weight:700;
  padding:10px 18px;border-radius:999px;opacity:0;transition:all .25s;z-index:70;
  pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{margin-top:44px;text-align:center;color:var(--grey);font-size:12px;font-weight:500}
footer .ml{font-style:italic}
</style>
</head>
<body>
<div class="lines"></div>
<div class="wrap">

  <div class="banner">
    <span class="ml">Miracles happen every day.</span>
    <button id="snd-btn" aria-label="完成提示音开关"></button>
  </div>

  <header>
    <div>
      <h1>tomato<em>.</em></h1>
      <div class="sub">番茄田 · 一颗一颗，专心长大</div>
    </div>
    <div class="harvest">
      <div class="n"><span id="hv-n">0</span><small> 颗</small></div>
      <div class="t" id="hv-t">今天还没收成</div>
    </div>
  </header>

  <!-- 计时舞台 -->
  <section class="stage idle" id="stage">
    <div class="st-head">
      <span class="st-tag" id="st-tag">FOCUS</span>
      <span class="st-act" id="st-act"></span>
    </div>
    <div id="st-body"></div>
  </section>

  <!-- 种番茄 -->
  <section class="seed">
    <div class="seed-row">
      <input id="task-name" type="text" placeholder="这颗番茄为了什么？" maxlength="14" enterkeyhint="done">
    </div>
    <div class="sizes" id="sizes"></div>
    <div class="seed-foot">
      <span class="mins-box" id="mins-box" style="display:none">
        <input id="mins-input" type="number" inputmode="numeric" min="1" max="180" value="25"><span>分钟</span>
      </span>
      <button class="btn-plant" id="btn-plant">种 下</button>
    </div>
  </section>

  <!-- 番茄田 -->
  <div class="field-head">
    <h2>番茄田</h2>
    <span class="cnt" id="f-cnt"></span>
    <button class="clear" id="f-clear" style="display:none">清空熟透的</button>
  </div>
  <div class="field" id="field"></div>

  <footer>
    <span class="ml">Plant a tomato, focus till it's ripe.</span><br>
    汁水涨满的那一刻，就是专注的样子
  </footer>
</div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet"></div>
<div class="confetti" id="confetti"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- 数据 ---------- */
const KEY='tomato_farm_'+new Date().toISOString().slice(0,10);
const SKEY='tomato_sound';
const SIZES={
  L:{nm:'大番茄',def:50,d:132},
  M:{nm:'中番茄',def:25,d:112},
  S:{nm:'小番茄',def:10,d:88}
};
let tasks=[],active=null,sound=(localStorage.getItem(SKEY)!=='0');
try{tasks=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){tasks=[]}
try{active=JSON.parse(localStorage.getItem(KEY+'_active')||'null')}catch(e){active=null}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks));localStorage.setItem(KEY+'_active',JSON.stringify(active))}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- 番茄 SVG ---------- */
const BODY='M62,25 C85,19 107,38 106,65 C107,92 87,112 60,113 C33,112 13,92 14,65 C15,39 36,20 62,25 Z';
let cid=0;
function tomatoSVG(pct,opts){
  opts=opts||{};
  const id='tclip'+(++cid);
  const stroke=opts.stroke||'#E64B35';
  const juiceFill=opts.juice||'#E64B35';
  const leaf=opts.leaf||'#3F9B4F';
  const r=Math.max(0,Math.min(1,pct));
  const ty=(1-r)*122;
  return `<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="${id}"><path d="${BODY}"/></clipPath></defs>
  <path d="${BODY}" fill="#fff"/>
  <g clip-path="url(#${id})">
    <rect x="0" y="0" width="120" height="122" fill="${juiceFill}"
      style="transform:translateY(${ty}px);transition:transform 1s linear" opacity="${opts.juiceOp||1}"/>
  </g>
  <path d="${BODY}" fill="none" stroke="${stroke}" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M60,26 C59,17 61,11 60,6" fill="none" stroke="${leaf}" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M60,24 C52,22 45,17 43,9 C50,12 57,18 60,22 Z" fill="${leaf}"/>
  <path d="M60,24 C68,21 75,16 78,8 C70,11 64,17 61,22 Z" fill="${leaf}"/>
  <path d="M60,25 C55,27 50,27 45,24 C51,22 57,23 60,25 Z" fill="${leaf}"/>
  ${opts.mood?`<text x="60" y="86" text-anchor="middle" font-size="30" fill="${opts.moodFill||'#fff'}" style="transform:rotate(-6deg);transform-origin:60px 80px">${opts.mood}</text>`:''}
  </svg>`;
}
const MOODS=['✓','☺','★','♪'];
function moodOf(t){return t.mood||'✓'}

/* ---------- 舞台 ---------- */
const stage=document.getElementById('stage'),stTag=document.getElementById('st-tag'),
      stAct=document.getElementById('st-act'),stBody=document.getElementById('st-body');
function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return m+':'+String(s).padStart(2,'0')}
function remaining(){
  if(!active)return 0;
  if(active.paused)return active.remaining;
  return Math.max(0,(active.endAt-Date.now())/1000);
}
function renderStage(){
  const t=active?tasks.find(x=>x.id===active.id):null;
  if(!t){
    stage.classList.add('idle');stTag.textContent='FOCUS';stAct.innerHTML='';
    stBody.innerHTML=`<div class="st-idle-msg"><div class="big">🌱 还没有在长的番茄</div>去田里点一颗，或先种一颗新的</div>`;
    return;
  }
  stage.classList.remove('idle');
  const total=t.mins*60,left=remaining(),p=total?1-left/total:1;
  stTag.textContent=active.paused?'PAUSED · 暂停':'GROWING · 专注中';
  stAct.innerHTML=`
    <button id="btn-pause">${active.paused?'▶ 继续':'⏸ 暂停'}</button>
    <button class="ghost" id="btn-drop">算了，不种了</button>`;
  stBody.innerHTML=`
    <div class="st-main">
      <div class="st-tomato ${active.paused?'':'pulsing'}">${tomatoSVG(p,{juiceOp:.92})}</div>
      <div class="st-info">
        <div class="st-name">${esc(t.name)}</div>
        <div class="st-time ${left<60?'over':''}">${fmt(left)}</div>
        <div class="st-hint">${SIZES[t.size].nm} · ${t.mins} 分钟 · 汁水已涨 ${Math.round(p*100)}%</div>
      </div>
    </div>`;
  document.getElementById('btn-pause').onclick=togglePause;
  document.getElementById('btn-drop').onclick=dropActive;
}
function togglePause(){
  if(!active)return;
  if(active.paused){active.endAt=Date.now()+active.remaining*1000;active.paused=false}
  else{active.remaining=remaining();active.paused=true}
  save();renderStage();renderField();
}
function dropActive(){
  if(!active)return;
  const t=tasks.find(x=>x.id===active.id);
  active=null;save();renderStage();renderField();
  toast(t?('「'+t.name+'」放回了田里，随时回来'):'放回了田里');
}
function startTimer(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  if(active&&active.id!==id){toast('先让现在这颗长大吧 🍅');return}
  active={id:id,endAt:Date.now()+t.mins*60000,paused:false,remaining:t.mins*60};
  save();renderStage();renderField();
  stage.scrollIntoView({behavior:'smooth',block:'center'});
}
function finishActive(){
  if(!active)return;
  const t=tasks.find(x=>x.id===active.id);
  active=null;
  if(t){t.done=true;t.spent=t.mins;t.mood=MOODS[Math.floor(Math.random()*MOODS.length)];confetti();ding();
    toast('熟了！「'+t.name+'」收进篮子 🍅')}
  save();renderStage();renderField();renderHarvest();
}

/* ---------- 田 ---------- */
const field=document.getElementById('field');
function renderField(){
  const list=document.getElementById('f-cnt'),clearB=document.getElementById('f-clear');
  const undone=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);
  list.textContent=tasks.length?`待长 ${undone.length} · 已熟 ${done.length}`:'';
  clearB.style.display=done.length?'':'none';
  if(!tasks.length){
    field.innerHTML=`<div class="empty">${tomatoSVG(0)}<div class="e-t">田是空的</div><div class="e-s">种下第一颗番茄，挑个大小</div></div>`;
    return;
  }
  const all=undone.concat(done);
  field.innerHTML=all.map(t=>{
    const cls=['tcard',t.size==='L'?'big':(t.size==='S'?'small':''),t.done?'done':'',active&&active.id===t.id?'running':''].join(' ');
    const svg=t.done?tomatoSVG(1,{mood:moodOf(t),moodFill:'#fff',juiceOp:1})
                    :(active&&active.id===t.id?tomatoSVG(1-remaining()/(t.mins*60),{juiceOp:.92}):tomatoSVG(0));
    return `<div class="${cls}" data-id="${t.id}">${t.done?'':`<span class="tmark">${active&&active.id===t.id?'● 长大中':''}</span>`}${svg}<div class="tname">${esc(t.name)}</div></div>`;
  }).join('');
  field.querySelectorAll('.tcard').forEach(c=>c.onclick=()=>openSheet(c.dataset.id));
}
function renderHarvest(){
  const done=tasks.filter(t=>t.done);
  document.getElementById('hv-n').textContent=done.length;
  const mins=done.reduce((s,t)=>s+(t.spent||0),0);
  document.getElementById('hv-t').textContent=done.length?(mins?`专注 ${mins} 分钟`:'都是快速熟透的'):'今天还没收成';
}

/* ---------- sheet ---------- */
const mask=document.getElementById('mask'),sheet=document.getElementById('sheet');
let sheetId=null;
function openSheet(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  sheetId=id;
  const running=active&&active.id===id;
  let btns='';
  if(t.done){
    btns=`<button class="sh-btn" data-act="undo">↩ 放回田里重新长</button>
          <button class="sh-btn danger" data-act="del">✕ 从田里拔掉</button>`;
  }else if(running){
    btns=`<button class="sh-btn primary" data-act="goto">🍅 回到长大的番茄</button>
          <button class="sh-btn orange" data-act="ripe">直接让它熟了</button>
          <button class="sh-btn danger" data-act="del">✕ 拔掉</button>`;
  }else{
    btns=`<button class="sh-btn primary" data-act="start">▶ 开始专注 ${t.mins} 分钟</button>
          <button class="sh-btn orange" data-act="ripe">直接让它熟了</button>
          <button class="sh-btn danger" data-act="del">✕ 拔掉</button>`;
  }
  sheet.innerHTML=`<div class="grab"></div>
    <div class="sh-head">
      <div class="sh-tom">${t.done?tomatoSVG(1,{mood:moodOf(t),moodFill:'#fff'}):tomatoSVG(0)}</div>
      <div style="min-width:0">
        <div class="sh-name">${esc(t.name)}</div>
        <div class="sh-meta">${SIZES[t.size].nm} · ${t.mins} 分钟${t.done?(' · 已熟'+(t.spent?(' · 专注了 '+t.spent+' 分钟'):'')):''}</div>
      </div>
    </div>
    <div class="sh-btns">${btns}</div>`;
  sheet.classList.add('show');mask.classList.add('show');
  sheet.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
}
function closeSheet(){sheet.classList.remove('show');mask.classList.remove('show');sheetId=null}
mask.onclick=closeSheet;
function act(a){
  const t=tasks.find(x=>x.id===sheetId);
  if(!t){closeSheet();return}
  if(a==='start'){closeSheet();startTimer(t.id)}
  else if(a==='goto'){closeSheet();stage.scrollIntoView({behavior:'smooth',block:'center'})}
  else if(a==='ripe'){
    if(active&&active.id===t.id)active=null;
    t.done=true;t.mood=MOODS[Math.floor(Math.random()*MOODS.length)];
    closeSheet();save();renderAll();confetti();ding();toast('熟了！不用计时也很棒 🍅');
  }
  else if(a==='undo'){t.done=false;t.spent=0;t.mood=null;closeSheet();save();renderAll();toast('放回田里啦')}
  else if(a==='del'){
    if(active&&active.id===t.id)active=null;
    tasks=tasks.filter(x=>x.id!==t.id);
    closeSheet();save();renderAll();toast('拔掉了');
  }
}

/* ---------- 种 ---------- */
let curSize='M';
const sizesEl=document.getElementById('sizes');
sizesEl.innerHTML=['S','M','L'].map(k=>{
  const s=SIZES[k];
  return `<div class="size-chip cs${k} ${k===curSize?'on':''}" data-k="${k}">
    ${tomatoSVG(0)}
    <div class="nm">${s.nm}</div><div class="mn" data-mn="${k}">${s.def} 分钟</div></div>`;
}).join('');
sizesEl.querySelectorAll('.size-chip').forEach(ch=>{
  ch.onclick=()=>{curSize=ch.dataset.k;
    sizesEl.querySelectorAll('.size-chip').forEach(x=>x.classList.toggle('on',x.dataset.k===curSize));
    updMins();};
});
const minsBox=document.getElementById('mins-box'),minsInput=document.getElementById('mins-input');
function updMins(){minsBox.style.display='';minsInput.value=SIZES[curSize].def;
  minsInput.oninput=()=>{const v=Math.max(1,Math.min(180,parseInt(minsInput.value)||SIZES[curSize].def));
    document.querySelector(`[data-mn="${curSize}"]`).textContent=v+' 分钟';};}
updMins();
document.getElementById('btn-plant').onclick=plant;
document.getElementById('task-name').addEventListener('keydown',e=>{if(e.key==='Enter')plant()});
function plant(){
  const inp=document.getElementById('task-name'),name=inp.value.trim();
  if(!name){inp.focus();toast('先写一句：这颗番茄为了什么？');return}
  const mins=Math.max(1,Math.min(180,parseInt(minsInput.value)||SIZES[curSize].def));
  tasks.unshift({id:uid(),name:name,size:curSize,mins:mins,done:false,spent:0});
  inp.value='';save();renderField();renderHarvest();
  toast('种下了！点它开始长大 🌱');
  inp.blur();
}
document.getElementById('f-clear').onclick=()=>{
  const n=tasks.filter(t=>t.done).length;
  tasks=tasks.filter(t=>!t.done);save();renderAll();toast('清掉了 '+n+' 颗熟透的');
};

/* ---------- 反馈 ---------- */
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2100);
}
function confetti(){
  const box=document.getElementById('confetti'),fr=['🍅','✨','🍅','⭐','🍅','✨'];
  fr.forEach((f,i)=>{
    const s=document.createElement('span');s.textContent=f;
    s.style.left=(38+Math.random()*24)+'%';s.style.top='-10px';
    s.style.animationDelay=(i*0.07)+'s';s.style.animationDuration=(1.1+Math.random()*0.7)+'s';
    box.appendChild(s);setTimeout(()=>s.remove(),2200);
  });
}
let AC=null;
function ding(){
  if(!sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    [[659,0],[880,0.14]].forEach(([f,d])=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);
      const t0=AC.currentTime+d;
      g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.18,t0+.02);
      g.gain.exponentialRampToValueAtTime(.001,t0+.5);
      o.start(t0);o.stop(t0+.55);
    });
  }catch(e){}
}

/* ---------- 循环 ---------- */
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function tick(){
  if(!active||active.paused)return;
  if(remaining()<=0){finishActive();return}
  renderStage();
  const t=tasks.find(x=>x.id===active.id);
  if(t){
    const card=field.querySelector(`[data-id="${t.id}"]`);
    if(card){const svg=card.querySelector('svg');if(svg)
      card.innerHTML=`<span class="tmark">● 长大中</span>`+tomatoSVG(1-remaining()/(t.mins*60),{juiceOp:.92})+`<div class="tname">${esc(t.name)}</div>`;
      card.classList.add('running');card.onclick=()=>openSheet(t.id);}
  }
}
setInterval(tick,1000);
function renderAll(){renderStage();renderField();renderHarvest()}

/* 声音开关 */
const sndBtn=document.getElementById('snd-btn');
function renderSnd(){sndBtn.textContent=sound?'🔔':'🔕'}
sndBtn.onclick=()=>{sound=!sound;localStorage.setItem(SKEY,sound?'1':'0');renderSnd();
  if(sound)ding();toast(sound?'完成会响铃':'已静音')};
renderSnd();

/* 启动：恢复中断的计时（后台走过头的直接算熟） */
if(active){
  const t=tasks.find(x=>x.id===active.id);
  if(!t){active=null;save()}
  else if(!active.paused&&remaining()<=0){finishActive()}
}
renderAll();
</script>
</body>
</html>
