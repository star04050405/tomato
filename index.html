<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tomato. 番茄田 · 一颗一颗专心长大</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-v3-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-v3.png">
<meta name="theme-color" content="#F26A2E">
<style>
  :root{
    --red:#E64B35; --red-deep:#C93A26; --green:#3F9B4F; --green-deep:#2F7C3D;
    --orange:#F26A2E; --ink:#2B2B2B; --ink-soft:#6B6B6B;
    --paper:#FDFBF6; --line:#E7E2D6; --card:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{font-size:16px}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--paper) repeating-linear-gradient(180deg,transparent 0 31px,var(--line) 31px 32px);
    color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  /* 台历橙条 */
  .cal-head{
    background:var(--orange);color:#fff;font-size:12px;font-weight:600;letter-spacing:.04em;
    padding:7px 16px;display:flex;justify-content:space-between;align-items:center;
  }
  .cal-head .dot{opacity:.85}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 90px}
  header.hero{padding:26px 0 6px}
  .brand{font-size:34px;font-weight:800;letter-spacing:-.01em}
  .brand i{font-style:normal;color:var(--orange)}
  .slogan{color:var(--ink-soft);font-size:13.5px;margin-top:4px}
  /* 收成统计 */
  .harvest{
    display:flex;gap:10px;align-items:stretch;margin:16px 0 6px;
  }
  .harvest .h-card{
    flex:1;background:var(--card);border:2px solid var(--ink);border-radius:14px;
    padding:10px 12px;box-shadow:3px 3px 0 rgba(43,43,43,.9);
  }
  .h-card b{font-size:26px;font-weight:800;display:block;line-height:1.1}
  .h-card span{font-size:11.5px;color:var(--ink-soft)}
  .h-card.red b{color:var(--red)}
  /* 种番茄表单 */
  .plant{
    background:var(--card);border:2px solid var(--ink);border-radius:16px;
    padding:14px;margin-top:14px;box-shadow:3px 3px 0 rgba(43,43,43,.9);
  }
  .plant h2{font-size:15px;font-weight:800;margin-bottom:10px}
  .plant h2::before{content:"🌱 ";font-size:13px}
  input[type=text],input[type=number]{
    width:100%;font-size:16px;padding:11px 12px;border:2px solid var(--ink);
    border-radius:11px;background:#fff;color:var(--ink);outline:none;font-family:inherit;
  }
  input[type=text]:focus,input[type=number]:focus{box-shadow:0 0 0 3px rgba(242,106,46,.25)}
  .sizes{display:flex;gap:8px;margin-top:10px}
  .size-btn{
    flex:1;border:2px solid var(--ink);background:#fff;border-radius:11px;
    padding:8px 4px 7px;text-align:center;cursor:pointer;transition:.15s;position:relative;
  }
  .size-btn .tom{display:block;margin:0 auto 3px}
  .size-btn b{font-size:12.5px;display:block}
  .size-btn small{font-size:10.5px;color:var(--ink-soft);display:block;margin-top:1px}
  .size-btn.on{background:#FDEDE7;border-color:var(--red);box-shadow:2px 2px 0 var(--red)}
  .size-btn.on b{color:var(--red-deep)}
  .mins-edit{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--ink-soft)}
  .mins-edit input{width:86px;text-align:center;font-weight:700}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:2px solid var(--ink);border-radius:999px;padding:11px 22px;
    font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .btn.primary{background:var(--orange);color:#fff;box-shadow:3px 3px 0 rgba(43,43,43,.9)}
  .btn.primary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(43,43,43,.9)}
  .btn.ghost{background:#fff;color:var(--ink)}
  .btn.ghost:active{transform:translate(1px,1px)}
  .btn.danger{background:#fff;color:var(--red-deep);border-color:var(--red-deep)}
  .plant .go{width:100%;margin-top:12px}
  /* 舞台 */
  .stage{
    margin-top:16px;background:var(--card);border:2px solid var(--ink);border-radius:18px;
    padding:20px 16px 18px;text-align:center;box-shadow:4px 4px 0 rgba(43,43,43,.9);display:none;
  }
  .stage.show{display:block;animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
  .stage .tag{
    display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:700;
    padding:3px 12px;border-radius:999px;letter-spacing:.06em;margin-bottom:10px;
  }
  .stage .tag.done{background:var(--green)}
  #stageTom{margin:2px auto 0}
  .tj-box{position:relative;display:inline-flex;align-items:flex-end;justify-content:center;line-height:1}
  .tj-g{filter:grayscale(1);opacity:.4}
  .tj-c{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;transition:clip-path .9s linear}
  .tj-mood{position:absolute;top:0;right:-4px;font-size:.26em;background:#fff;border:2.5px solid var(--red);border-radius:50%;width:1.7em;height:1.7em;display:flex;align-items:center;justify-content:center;box-shadow:1.5px 1.5px 0 rgba(46,42,38,.15)}
  .tj-box.done .tj-c{animation:tpop .45s}
  @keyframes tpop{0%{transform:scale(.85)}55%{transform:scale(1.1)}100%{transform:scale(1)}}
  .clock{font-size:52px;font-weight:800;letter-spacing:.02em;line-height:1;font-variant-numeric:tabular-nums}
  .stage .task-name{font-size:16px;font-weight:700;margin-top:8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stage .pct{font-size:12px;color:var(--ink-soft);margin-top:3px}
  .stage-btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  /* 番茄田 */
  .field-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 4px}
  .field-h h2{font-size:17px;font-weight:800}
  .field-h h2::before{content:"🍅 "}
  .field-h span{font-size:12px;color:var(--ink-soft)}
  .field{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
  .tom-card{
    background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px 8px 10px;
    text-align:center;cursor:pointer;transition:.15s;box-shadow:3px 3px 0 rgba(43,43,43,.55);position:relative;
  }
  .tom-card:active{transform:translate(1px,1px)}
  .tom-card.running{border-color:var(--red);box-shadow:3px 3px 0 var(--red);animation:breath 2.4s ease-in-out infinite}
  @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  .tom-card .nm{
    font-weight:800;font-size:13px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .tom-card .mt{font-size:10.5px;color:var(--ink-soft);margin-top:2px}
  .tom-card.is-done{background:#FDEDE7}
  .tom-card.is-done .nm{color:var(--red-deep)}
  .badge-run{
    position:absolute;top:-9px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:800;
    padding:3px 8px;border-radius:999px;border:2px solid #fff;letter-spacing:.04em;
  }
  .empty{
    text-align:center;color:var(--ink-soft);font-size:13.5px;padding:34px 10px;
    border:2px dashed var(--line);border-radius:16px;margin-top:12px;background:rgba(255,255,255,.6);
  }
  .empty b{color:var(--ink)}
  /* sheet */
  .mask{position:fixed;inset:0;background:rgba(43,43,43,.4);z-index:50;opacity:0;pointer-events:none;transition:.2s}
  .mask.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--paper);
    border-radius:22px 22px 0 0;border-top:2px solid var(--ink);padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:.25s cubic-bezier(.2,.8,.3,1);max-width:560px;margin:0 auto;
  }
  .sheet.show{transform:translateY(0)}
  .sheet .grab{width:40px;height:4px;background:#D8D2C4;border-radius:99px;margin:0 auto 14px}
  .sheet .t-title{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
  .sheet .t-meta{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
  .sheet .col{display:flex;flex-direction:column;gap:9px;margin-top:16px}
  .sheet .btn{width:100%}
  .sheet .btn.harvest{background:var(--red);color:#fff;box-shadow:3px 3px 0 rgba(43,43,43,.9)}
  .sheet .btn.go-run{background:var(--ink);color:#fff;box-shadow:3px 3px 0 rgba(43,43,43,.35)}
  /* 撒花 */
  .confetti{position:fixed;top:-14px;z-index:99;font-size:19px;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.9}}
  /* toast */
  .toast{
    position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:13.5px;font-weight:600;padding:10px 18px;
    border-radius:999px;opacity:0;transition:.25s;z-index:60;white-space:nowrap;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{margin-top:34px;text-align:center;font-size:11.5px;color:#B9B2A2}
  footer .mira{font-family:Georgia,serif;font-style:italic;font-size:12.5px;color:var(--orange);margin-bottom:3px}
  .sound-toggle{background:none;border:none;font-size:16px;cursor:pointer;opacity:.9}
</style>
</head>
<body>
<div class="cal-head">
  <span>🧃 Miracles happen every day.</span>
  <span class="dot" id="todayStr"></span>
  <button class="sound-toggle" id="soundBtn" aria-label="音效开关">🔔</button>
</div>

<div class="wrap">
  <header class="hero">
    <div class="brand">tomato<i>.</i></div>
    <div class="slogan">番茄田 · 一颗一颗，专心长大</div>
  </header>

  <div class="harvest">
    <div class="h-card red"><b id="cntDone">0</b><span>今天熟的番茄 🍅</span></div>
    <div class="h-card"><b id="cntMins">0<small style="font-size:13px"> 分钟</small></b><span>今天的专注总量</span></div>
  </div>

  <!-- 舞台 -->
  <div class="stage" id="stage">
    <span class="tag" id="stageTag">专注中</span>
    <div id="stageTom" class="tj-box" aria-hidden="true"><span class="tj-g">🍅</span><span class="tj-c" style="clip-path:inset(101% 0 0 0)">🍅</span></div>
    <div class="clock" id="clock">25:00</div>
    <div class="task-name" id="stageName">—</div>
    <div class="pct" id="stagePct">涨汁 0%</div>
    <div class="stage-btns">
      <button class="btn ghost" id="btnPause">⏸ 暂停</button>
      <button class="btn ghost" id="btnGiveup">💧 算了</button>
    </div>
  </div>

  <!-- 种番茄 -->
  <div class="plant">
    <h2>种一颗番茄</h2>
    <input type="text" id="taskName" maxlength="24" placeholder="这段时间专心做什么？（写在番茄上）">
    <div class="sizes">
      <div class="size-btn" data-size="L" role="button" tabindex="0">
        <span class="tom" style="font-size:40px">🍅</span>
        <b>大番茄</b><small>深潜 50 分</small>
      </div>
      <div class="size-btn on" data-size="M" role="button" tabindex="0">
        <span class="tom" style="font-size:32px">🍅</span>
        <b>中番茄</b><small>经典 25 分</small>
      </div>
      <div class="size-btn" data-size="S" role="button" tabindex="0">
        <span class="tom" style="font-size:24px">🍅</span>
        <b>小番茄</b><small>微专注 10 分</small>
      </div>
    </div>
    <div class="mins-edit">⏱ 自定义分钟：<input type="number" id="minsInput" min="1" max="180" value="25" inputmode="numeric">（留空用默认）</div>
    <button class="btn primary go" id="btnPlant">种下这颗番茄 🌱</button>
  </div>

  <!-- 番茄田 -->
  <div class="field-h">
    <h2>番茄田</h2>
    <span id="fieldCount">0 颗 · 0 熟</span>
  </div>
  <div class="field" id="field"></div>
  <div class="empty" id="empty">田里还空着。<br><b>种一颗番茄</b>，点它就开始专心；来不及计时的话，点「已经熟了」也算数 🍅</div>

  <footer>
    <div class="mira">Miracles happen every day.</div>
    每天清晨，田里重新翻土 · 熟了的番茄只属于今天
  </footer>
</div>

<!-- sheet -->
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="t-title" id="shTitle">番茄</div>
  <div class="t-meta" id="shMeta"></div>
  <div class="col" id="shBtns"></div>
</div>

<div class="toast" id="toast"></div>

<!-- 番茄形状模板 -->

<script>
(function(){
'use strict';
/* ---------- 常量与状态 ---------- */
var SIZES={L:{label:'大番茄',mins:50,r:118},M:{label:'中番茄',mins:25,r:92},S:{label:'小番茄',mins:10,r:66}};
var MOODS=['✓','★','☺'];
var RED='#E64B35', RED_DEEP='#C93A26', INK='#2B2B2B';
var todayStr=function(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
var KEY='tomato_farm_v1';
var state={date:todayStr(),tasks:[],sound:true,seq:1};
try{
  var raw=localStorage.getItem(KEY);
  if(raw){var p=JSON.parse(raw); if(p&&p.date===todayStr()){state=p;}}
}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

/* ---------- DOM ---------- */
function $(id){return document.getElementById(id)}
var fieldEl=$('field'),emptyEl=$('empty'),stageEl=$('stage');

/* ---------- 番茄 SVG 渲染 ---------- */
var uid=0;
function tomSVG(sizePx,opts){
  opts=opts||{};
  var p=opts.fill?1:Math.max(0,Math.min(1,opts.progress||0));
  var clipP=p<=0?101:Math.round((1-p)*1000)/10;
  var mood=opts.fill&&opts.mood?opts.mood:'';
  var s='<div class="tj-box'+(opts.fill?' done':'')+'" style="width:'+sizePx+'px;height:'+sizePx+'px;font-size:'+Math.round(sizePx*0.74)+'px">';
  s+='<span class="tj-g">🍅</span>';
  s+='<span class="tj-c" style="clip-path:inset('+clipP+'% 0 0 0)">🍅</span>';
  if(mood)s+='<span class="tj-mood">'+mood+'</span>';
  s+='</div>';
  return s;
}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cut(s,n){return s.length>n?s.slice(0,n-1)+'…':s}

/* ---------- 渲染田 ---------- */
var activeId=null,paused=false,remainingMs=0,endAt=0,tickTimer=null;
function render(){
  // 田
  var html='';
  state.tasks.forEach(function(t){
    var size=SIZES[t.size].r;
    var isDone=!!t.done;
    var running=t.id===activeId&&!isDone;
    var prog=running?progressOf(t):0;
    var svg=tomSVG(size,{name:t.name,fill:isDone,progress:running?prog:0,mood:t.mood});
    var cls='tom-card'+(isDone?' is-done':'')+(running?' running':'');
    html+='<div class="'+cls+'" data-id="'+t.id+'">'+
      (running?'<span class="badge-run">专注中</span>':'')+
      svg+
      '<div class="nm">'+esc(t.name)+'</div>'+
      '<div class="mt">'+SIZES[t.size].label+' · '+t.mins+' 分'+(isDone?' · 熟了 ✓':'')+'</div>'+
      '</div>';
  });
  fieldEl.innerHTML=html;
  emptyEl.style.display=state.tasks.length?'none':'block';
  var doneN=state.tasks.filter(function(t){return t.done}).length;
  $('fieldCount').textContent=state.tasks.length+' 颗 · '+doneN+' 熟';
  var mins=state.tasks.filter(function(t){return t.done}).reduce(function(a,t){return a+t.mins},0);
  $('cntDone').textContent=doneN;
  $('cntMins').innerHTML=mins+'<small style="font-size:13px"> 分钟</small>';
  // 舞台可见性
  var act=state.tasks.filter(function(t){return t.id===activeId})[0];
  if(act){stageEl.classList.add('show');renderStage(act);}
  else{stageEl.classList.remove('show');}
  $('todayStr').textContent=todayStr().slice(5).replace('-','/');
  $('soundBtn').textContent=state.sound?'🔔':'🔕';
  save();
}
function renderStage(t){
  var prog=t.done?1:progressOf(t);
  $('stageTom').outerHTML=tomSVG(270,{name:'',stage:true,progress:prog,fill:t.done,mood:t.mood,id:1}).replace('class="tj-box"','id="stageTom" class="tj-box"');
  var rem=msLeft(t);
  $('clock').textContent=paused?fmtClock(remainingMs):fmtClock(rem);
  $('stageName').textContent=t.name;
  $('stagePct').textContent=t.done?'熟透了 🍅':'涨汁 '+Math.round(prog*100)+'%';
  $('stageTag').className='tag'+(t.done?' done':'');
  $('stageTag').textContent=t.done?'收成':'专注中';
  $('btnPause').textContent=paused?'▶ 继续':'⏸ 暂停';
  $('btnPause').style.display=t.done?'none':'';
}
/* ---------- 计时 ---------- */
function progressOf(t){
  if(paused)return 1-(remainingMs/(t.mins*60000));
  return Math.min(1,1-msLeft(t)/(t.mins*60000));
}
function msLeft(t){return Math.max(0,endAt-Date.now())}
function fmtClock(ms){
  var s=Math.ceil(ms/1000),m=Math.floor(s/60);s=s%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function startRun(t){
  activeId=t.id;paused=false;
  endAt=Date.now()+t.mins*60000;
  remainingMs=t.mins*60000;
  startTick();
  stageEl.scrollIntoView({behavior:'smooth',block:'start'});
  toast('开种！番茄开始长 🌱');
  render();
}
function startTick(){
  clearInterval(tickTimer);
  tickTimer=setInterval(function(){
    var t=state.tasks.filter(function(x){return x.id===activeId&&!x.done})[0];
    if(!t){clearInterval(tickTimer);return}
    if(!paused){
      var rem=msLeft(t);
      if(rem<=0){finish(t);return}
      $('clock').textContent=fmtClock(rem);
      var prog=progressOf(t);
      $('stagePct').textContent='涨汁 '+Math.round(prog*100)+'%';
      var svg=$('stageTom');
      if(svg){
        var cEl=svg.querySelector('.tj-c');
        if(cEl&&!t.done){cEl.style.clipPath='inset('+Math.max(0,(1-prog)*100)+'% 0 0 0)';}
      }
      // 田里小番茄同步水位
      var card=fieldEl.querySelector('.tom-card.running');
      if(card){
        var c2=card.querySelector('.tj-c');
      }
    }
  },500);
}
function finish(t){
  t.done=true;t.mood=MOODS[Math.floor(Math.random()*MOODS.length)];t.doneAt=Date.now();
  activeId=null;paused=false;clearInterval(tickTimer);
  confetti();ding();
  toast('「'+t.name+'」熟了！🍅');
  render();
  $('stageTag').textContent='收成';
  $('stageTag').className='tag done';
  $('stagePct').textContent='熟透了 🍅';
  $('btnPause').style.display='none';
  setTimeout(function(){if(!activeId&&stageEl.classList.contains('show')&&t&&t.done){stageEl.classList.remove('show');}},3500);
}
/* ---------- 音效 ---------- */
function ding(){
  if(!state.sound)return;
  try{
    var ac=new (window.AudioContext||window.webkitAudioContext)();
    var notes=[[880,0],[1174.66,0.13]];
    notes.forEach(function(n){
      var o=ac.createOscillator(),g=ac.createGain();
      o.type='sine';o.frequency.value=n[0];
      g.gain.setValueAtTime(0.001,ac.currentTime+n[1]);
      g.gain.exponentialRampToValueAtTime(0.18,ac.currentTime+n[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+n[1]+0.55);
      o.connect(g);g.connect(ac.destination);
      o.start(ac.currentTime+n[1]);o.stop(ac.currentTime+n[1]+0.6);
    });
  }catch(e){}
}
/* ---------- 撒花 ---------- */
function confetti(){
  var chars=['🍅','✨','🍅','⭐','🍅'];
  for(var i=0;i<16;i++){
    var e=document.createElement('span');
    e.className='confetti';e.textContent=chars[i%chars.length];
    e.style.left=(Math.random()*96+2)+'vw';
    e.style.animationDuration=(Math.random()*1.4+1.6)+'s';
    e.style.animationDelay=(Math.random()*0.4)+'s';
    document.body.appendChild(e);
    setTimeout(function(el){return function(){el.remove()}}(e),4200);
  }
}
/* ---------- toast / sheet ---------- */
var toastTimer=null;
function toast(msg){
  var el=$('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show')},2100);
}
var sheetCtx=null;
function openSheet(t){
  sheetCtx=t;
  $('shTitle').innerHTML=(t.done?'🍅 ':'🌿 ')+esc(t.name);
  $('shMeta').textContent=SIZES[t.size].label+' · '+t.mins+' 分钟'+(t.done?' · '+new Date(t.doneAt).formatHM()+' 收成':' · 还没开始长');
  var b=$('shBtns');b.innerHTML='';
  function add(label,cls,fn){
    var btn=document.createElement('button');btn.className='btn '+cls;btn.textContent=label;
    btn.addEventListener('click',function(){closeSheet();fn();});
    b.appendChild(btn);
  }
  if(t.done){
    add('↩ 摘下来重新长（撤销收成）','ghost',function(){t.done=false;t.mood=null;toast('回到线条态，随时再种 🌿');render();});
    add('🗑 从田里移走','danger',function(){state.tasks=state.tasks.filter(function(x){return x.id!==t.id});render();});
  }else{
    add('▶ 开始专心（计时涨汁）','go-run',function(){startRun(t);});
    add('🍅 已经熟了（直接收成）','harvest',function(){t.done=true;t.mood=MOODS[Math.floor(Math.random()*MOODS.length)];t.doneAt=Date.now();confetti();toast('「'+t.name+'」熟了！');render();});
    add('🗑 从田里移走','danger',function(){if(t.id===activeId){activeId=null;paused=false;clearInterval(tickTimer);}state.tasks=state.tasks.filter(function(x){return x.id!==t.id});render();});
  }
  $('mask').classList.add('show');$('sheet').classList.add('show');
}
function closeSheet(){$('mask').classList.remove('show');$('sheet').classList.remove('show');}
Date.prototype.formatHM=function(){return String(this.getHours()).padStart(2,'0')+':'+String(this.getMinutes()).padStart(2,'0')};

/* ---------- 事件 ---------- */
$('mask').addEventListener('click',closeSheet);
fieldEl.addEventListener('click',function(e){
  var card=e.target.closest('.tom-card');
  if(!card)return;
  var id=Number(card.getAttribute('data-id'));
  var t=state.tasks.filter(function(x){return x.id===id})[0];
  if(t)openSheet(t);
});
$('btnGiveup').addEventListener('click',function(){
  var t=state.tasks.filter(function(x){return x.id===activeId})[0];
  if(!t)return;
  activeId=null;paused=false;clearInterval(tickTimer);
  toast('汁水退掉了，没关系 🌿');
  render();
});
$('btnPause').addEventListener('click',function(){
  var t=state.tasks.filter(function(x){return x.id===activeId&&!x.done})[0];
  if(!t)return;
  if(!paused){paused=true;remainingMs=msLeft(t);toast('暂停 · 汁水先冻住');}
  else{paused=false;endAt=Date.now()+remainingMs;toast('继续长 🍅');}
  render();
});
$('soundBtn').addEventListener('click',function(){state.sound=!state.sound;render();});

/* 种番茄表单 */
var selSize='M';
document.querySelectorAll('.size-btn').forEach(function(b){
  function pick(){
    document.querySelectorAll('.size-btn').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');selSize=b.getAttribute('data-size');
    $('minsInput').value=SIZES[selSize].mins;
  }
  b.addEventListener('click',pick);
  b.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();pick();}});
});
$('btnPlant').addEventListener('click',function(){
  var name=$('taskName').value.trim();
  if(!name){toast('先给番茄写上要专心做的事吧');$('taskName').focus();return}
  var mins=parseInt($('minsInput').value,10);
  if(!mins||mins<1||mins>180)mins=SIZES[selSize].mins;
  state.tasks.push({id:state.seq++,name:name,size:selSize,mins:mins,done:false,mood:null});
  $('taskName').value='';
  toast('种下了「'+cut(name,8)+'」🌱');
  render();
  fieldEl.scrollIntoView({behavior:'smooth',block:'end'});
});
$('taskName').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();$('btnPlant').click();}});

render();
})();
</script>
</body>
